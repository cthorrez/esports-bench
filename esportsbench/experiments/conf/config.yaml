# default hyperparameters

# data_dir: 'hf_data'
data_dir: 'final_data_v3_1'
train_end_date: '2023-09-30'
test_end_date: '2024-09-30'
rating_period: '7D'
num_samples: 16
num_processes: 16
games: ['tetris', 'halo']
# 'all' or a list of keys from broad_sweep_config, e.g. ['elo', 'glicko']
rating_systems: 'all'
# fine sweep only: broad sweep results to refine, relative to conf/sweep_results
sweep_results_path: 'broad_sweep_${rating_period}_1000'

# this will load the values from the listed file
defaults:
  - _self_
  - broad_sweep_config: default