[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "esportsbench"
version = "0.0.1"
description = "esports datasets for benchmarking rating systems"
authors = [
    {name="Clayton Thorrez", email="claytonthorrez@gmail.com"},
]
requires-python = ">=3.12"
dependencies = [
    "requests",
    "python-dotenv",
    "numpy",
    "polars",
    "pyyaml",
    "matplotlib",
    "datasets",
    "huggingface-hub",
    "omegaconf",
    # riix 0.1.0 is not on PyPI (latest there is 0.0.6, which lacks riix.models.baselines)
    "riix @ git+https://github.com/cthorrez/riix@6be7163081156008f98ea8c78ced165d522d9aed",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
